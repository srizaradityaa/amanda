name: Jaga Supabase tetap aktif

# Proyek Supabase gratis dijeda bila tidak ada aktivitas ~7 hari.
# Dua kali sehari, panggil fungsi publik (hanya agregat, tanpa data sensitif) agar basis data tetap aktif.
on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping basis data
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$URL" && test -n "$KEY" || { echo "Variabel Supabase kosong"; exit 1; }
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$URL/rest/v1/rpc/publik_daftar_ta" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}')
          echo "Status: $code"
          test "$code" = "200"
